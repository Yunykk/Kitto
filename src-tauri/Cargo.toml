[package]
name = "kito"
version = "0.1.0"
description = "Kito local music player starter"
authors = ["you"]
edition = "2024"

[lib]
# Avoid Windows name clash.
name = "kito_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
