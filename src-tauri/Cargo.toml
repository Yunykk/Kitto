[package]
name = "kitto"
version = "0.2.0"
description = "A local music player with playlists, themes and an equalizer"
authors = ["Yunykk"]
license = "MIT"
edition = "2024"

[lib]
# Avoid Windows name clash.
name = "kitto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-audio = { path = "plugins/android-audio" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
